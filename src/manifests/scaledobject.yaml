apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: slm-scaler
spec:
  scaleTargetRef:
    name: slm-model-deployment
  minReplicaCount: 1 # Or 0 if using scale-to-zero
  maxReplicaCount: 10
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
      metricName: bentoml_service_request_duration_count
      # Scale up if we see more than 5 requests per second per pod
      query: |
        sum(rate(bentoml_service_request_duration_count[1m]))
      threshold: '5'